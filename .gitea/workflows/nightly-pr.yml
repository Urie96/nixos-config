name: "Nightly PR from dev branch"

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-pr
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: x86_64-linux
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Open pull request and schedule auto-merge
        uses: urie96/gitea-pr@v1
        with:
          token: ${{ secrets.BOT_TOKEN }}
          head: dev
          base: main
          title: Nightly merge dev into main
          # Created by the action if the repository has no such label yet.
          labels: automated
          merge-method: merge
          delete-branch: true
