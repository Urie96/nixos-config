name: "PR check"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # 只在本机（home-server）跑：`nix run .#ci` 构建 `.#ci-all`（含所有架构的配置），
  # aarch64 的部分由 nix.buildMachines 派发到 orangepi5plus / macmini。
  #
  # job 名字保持 `check`：Gitea 分支保护里的 required status 是
  # "PR check / check (pull_request)"，改名会让新建的 PR 永远等不到这个 status。
  check:
    # Context reported to Gitea: "PR check / check (pull_request)".
    runs-on: x86_64-linux
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 构建什么、打印什么都在 modules/ci.nix 里；这里只管调用。
      - name: CI
        run: nix run .#ci
