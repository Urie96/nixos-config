# hypridle 配置：空闲自动锁屏（niri 时代没有独立的空闲锁屏，锁屏走 Noctalia）
# 参考: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # 收到 lock 请求（如合盖 / loginctl）时执行的锁屏命令
    lock_cmd = noctalia-shell ipc call lockScreen lock
    before_sleep_cmd = noctalia-shell ipc call lockScreen lock
}

# 10 分钟无操作 -> 锁屏
listener {
    timeout = 600
    on_timeout = noctalia-shell ipc call lockScreen lock
}

# 20 分钟无操作 -> 关闭显示器（移动鼠标/按键自动唤醒）
listener {
    timeout = 1200
    on_timeout = hyprctl dispatch dpms off
    on_resume = hyprctl dispatch dpms on
}
